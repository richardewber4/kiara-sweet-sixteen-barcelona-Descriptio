name: Barcelona Security Check

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours at :20 UTC, avoiding the top-of-hour traffic.
    - cron: "20 1,4,7,10,13,16,19,22 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: barcelona-security-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check official sources and generate status
        run: python scripts/security_check.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website including fresh security status
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy refreshed website and status
        id: deployment
        uses: actions/deploy-pages@v4
